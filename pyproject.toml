[project]
name = "gpt3-wellbeing"
version = "0.2.0"
description = "Clinical-trial check-in assistant: asks patients how they feel and structures their symptoms with an LLM."
authors = [{ name = "Eugene Chung", email = "ycechung@myseneca.ca" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
