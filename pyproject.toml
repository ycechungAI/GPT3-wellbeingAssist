[project]
name = "wellbeing-assist-prototype"
version = "0.2.0"
description = "Single-page clinical-trial check-in prototype: asks how a patient feels and structures their symptoms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
